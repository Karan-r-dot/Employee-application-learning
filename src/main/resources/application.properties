spring.application.name=employee-application
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db
spring.datasource.username=root
spring.datasource.password=karan
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret.key=mySuperSecretKeyForJwtAuthentication123456789
server.servlet.session.persistent=false
logging.level.root=INFO
logging.file.name=logs/application.logs

management.endpoints.web.exposure.include=*
management.info.env.enabled=true

info.app.name=Employee Application
info.app.version=1.0
info.app.developer=Karan

spring.data.redis.host=localhost
spring.data.redis.port=6379

# spring.kafka.bootstrap-servers=localhost:9092

#spring.datasource.url=${DB_URL} now springboot expects to come from outside
#spring.datasource.password=${DB_PASSWORD} now springboot expects password from Kubernetes
#jwt.secret.key=${JWT_SECRET} now springboot expects secret key from Kubernetes
#spring.data.redis.host=${REDIS_HOST} now springbott expects value from Kubernetes

